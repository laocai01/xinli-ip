<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0C2625;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#E8F0EE;overflow:hidden}
.wrap{width:1080px;height:1920px;padding:96px 130px 0;display:flex;flex-direction:column;align-items:center}

.tx em.c2{font-size:158px;color:#FFD07A;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' preserveAspectRatio='none'><path d='M6 22 C 30 8, 90 4, 150 12 S 196 26, 194 48 C 192 74, 130 92, 60 88 S 4 74, 6 22 Z' fill='%235A2E10'/></svg>");background-size:100% 100%;padding:8px 20px 12px}

/* ★ 装饰层 2026-10-09 */
.dots{position:absolute;left:0;right:0;top:1080px;height:220px;opacity:.45;
  background-image:radial-gradient(#C9A227 2px,transparent 2px);background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent 78%);

.corner{position:absolute;width:46px;height:46px;border-color:#C9A22788}

.corner.br{right:96px;bottom:96px;border-right:4px solid;border-bottom:4px solid}
