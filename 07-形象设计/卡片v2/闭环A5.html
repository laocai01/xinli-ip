<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#F5EBD8;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#2A2620;overflow:hidden}
.wrap{width:1080px;height:1920px;padding:96px 130px 0;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.brand img{width:84px;height:84px;border-radius:50%}
.brand .nm{font-size:46px;font-weight:800;letter-spacing:5px;color:#B9441E}
.rule{width:82%;height:4px;background:linear-gradient(90deg,transparent,#D9C7A8 20%,#D9C7A8 80%,transparent);margin-bottom:34px}
.tag{font-size:36px;color:#8A7A63;letter-spacing:6px;font-weight:700;margin-bottom:18px}
.concl{width:100%;background:none;border-radius:0;padding:10px 0 26px;box-shadow:none;margin-bottom:34px}
.concl .tx{font-size:96px;color:#2E2A26;font-weight:900;line-height:1.62;letter-spacing:2px;text-align:center;font-family:'DouyinSans','Kai',sans-serif}
.sub{font-size:32px;color:#8A7A63;letter-spacing:5px;font-weight:700;margin-bottom:26px}
.item{width:100%;margin-bottom:30px;text-align:center}
.t1{font-size:42px;font-weight:800;line-height:1.34;letter-spacing:1px}
.t2{font-size:33px;font-weight:500;line-height:1.4;color:#5C534A;margin-top:4px}
.next{width:100%;border:4px solid #E8590C;border-radius:20px;padding:24px 26px;margin-top:12px;background:rgba(232,89,12,.06)}
.next .lb{font-size:32px;color:#B9441E;font-weight:800;letter-spacing:5px;margin-bottom:8px}
.next .tx{font-size:44px;color:#3A3229;font-weight:900;line-height:1.3}
.follow{font-size:36px;color:#8A7A63;margin-top:28px;letter-spacing:3px;font-weight:600}
.sign{margin-top:26px;font-size:30px;color:#9C8B72;letter-spacing:3px}
.tx em{font-style:normal;font-size:132px;color:#FFF8F0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' preserveAspectRatio='none'><path d='M6 22 C 30 8, 90 4, 150 12 S 196 26, 194 48 C 192 74, 130 92, 60 88 S 4 74, 6 22 Z' fill='%23B01B25'/></svg>");background-repeat:no-repeat;background-size:100% 100%;padding:6px 16px 10px;display:inline-block;vertical-align:middle;letter-spacing:3px;font-family:'KaiTi','STKaiti','楷体',serif}
.tx em.c2{font-size:158px;color:#FFE45C;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' preserveAspectRatio='none'><path d='M6 22 C 30 8, 90 4, 150 12 S 196 26, 194 48 C 192 74, 130 92, 60 88 S 4 74, 6 22 Z' fill='%234A1D6E'/></svg>");background-size:100% 100%;padding:8px 20px 12px}

/* ★ 装饰层 2026-10-09 */
.dots{position:absolute;left:0;right:0;top:1080px;height:220px;opacity:.45;
  background-image:radial-gradient(#C8552F 2px,transparent 2px);background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent 78%);
  mask-image:radial-gradient(closest-side,#000,transparent 78%)}
.corner{position:absolute;width:46px;height:46px;border-color:#C8552F88}
.corner.tl{left:96px;top:96px;border-left:4px solid;border-top:4px solid}
.corner.tr{right:96px;top:96px;border-right:4px solid;border-top:4px solid}
.corner.bl{left:96px;bottom:96px;border-left:4px solid;border-bottom:4px solid}
.corner.br{right:96px;bottom:96px;border-right:4px solid;border-bottom:4px solid}
</style></head><body><div class="wrap"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="brand"><img src="__LOGO__"><div class="nm">老蔡说</div></div>
<div class="rule"></div>
<div class="tag">这一讲，就一句话</div>
<div class="concl"><div class="tx">你不是<em>脾气大</em><br>是有个地方<em class="c2">没好</em></div></div>
<div class="sub">记住这三点</div>
<div class="item"><div class="t1">1. 一点就炸，不是脾气问题</div><div class="t2">是碰到了旧伤口</div></div><div class="item"><div class="t1">2. 问自己一句</div><div class="t2">我炸的是现在，还是以前那件事？</div></div><div class="item"><div class="t1">3. 只要能分开</div><div class="t2">火就小一半</div></div>
<div class="next"><div class="lb">下一讲</div><div class="tx">躲的那个人<br>到底该说什么</div></div>
<div class="follow">跟上这个系列，下一讲还在这等你</div>
<div class="sign">正在学心理学的普通人 · 只说心事，不说教</div>
</div></body></html>
