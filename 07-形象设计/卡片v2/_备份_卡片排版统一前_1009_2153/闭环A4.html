<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#F5EBD8;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#2A2620;overflow:hidden}
.wrap{width:1080px;height:1920px;padding:96px 130px 0;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.brand img{width:84px;height:84px;border-radius:50%}
.brand .nm{font-size:46px;font-weight:800;letter-spacing:5px;color:#B9441E}
.rule{width:82%;height:4px;background:linear-gradient(90deg,transparent,#D9C7A8 20%,#D9C7A8 80%,transparent);margin-bottom:34px}
.tag{font-size:36px;color:#8A7A63;letter-spacing:6px;font-weight:700;margin-bottom:18px}
.concl{width:100%;background:#E8590C;border-radius:26px;padding:36px 30px;box-shadow:0 12px 34px rgba(232,89,12,.3);margin-bottom:42px}
.concl .tx{font-size:58px;color:#FFF;font-weight:900;line-height:1.36;letter-spacing:1px;text-align:center}
.sub{font-size:36px;color:#8A7A63;letter-spacing:5px;font-weight:700;margin-bottom:26px}
.item{width:100%;margin-bottom:30px;text-align:center}
.t1{font-size:48px;font-weight:800;line-height:1.34;letter-spacing:1px}
.t2{font-size:37px;font-weight:500;line-height:1.4;color:#5C534A;margin-top:4px}
.next{width:100%;border:4px solid #E8590C;border-radius:20px;padding:24px 26px;margin-top:12px;background:rgba(232,89,12,.06)}
.next .lb{font-size:32px;color:#B9441E;font-weight:800;letter-spacing:5px;margin-bottom:8px}
.next .tx{font-size:44px;color:#3A3229;font-weight:900;line-height:1.3}
.follow{font-size:36px;color:#8A7A63;margin-top:28px;letter-spacing:3px;font-weight:600}
.sign{margin-top:26px;font-size:30px;color:#9C8B72;letter-spacing:3px}
</style></head><body><div class="wrap">
<div class="brand"><img src="__LOGO__"><div class="nm">老蔡说</div></div>
<div class="rule"></div>
<div class="tag">这一讲，就一句话</div>
<div class="concl"><div class="tx">情绪不是想通的<br>是走通的</div></div>
<div class="sub">记住这三点</div>
<div class="item"><div class="t1">1. 堵的时候，别讲道理</div><div class="t2">先动一下身体</div></div><div class="item"><div class="t1">2. 开口说一句</div><div class="t2">随便什么，堵就松一半</div></div><div class="item"><div class="t1">3. 按胸口 5 秒 / 走三步</div><div class="t2">身体一松，情绪才有地方走</div></div>
<div class="next"><div class="lb">下一讲</div><div class="tx">为什么有的人一点就炸？<br>那个“点”到底在哪</div></div>
<div class="follow">跟上这个系列，下一讲还在这等你</div>
<div class="sign">正在学心理学的普通人 · 只说心事，不说教</div>
</div></body></html>
