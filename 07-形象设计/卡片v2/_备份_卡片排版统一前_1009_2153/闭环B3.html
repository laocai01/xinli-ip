<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0C2625;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#E8F0EE;overflow:hidden}
.wrap{width:1080px;height:1920px;padding:96px 130px 0;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.brand img{width:84px;height:84px;border-radius:50%}
.brand .nm{font-family:"KaiTi","STKaiti",serif;font-size:48px;font-weight:700;letter-spacing:8px;color:#F0C24B}
.rule{width:82%;height:4px;background:linear-gradient(90deg,transparent,rgba(240,194,75,.5) 20%,rgba(240,194,75,.5) 80%,transparent);margin-bottom:34px}
.tag{font-size:36px;color:#7E9C98;letter-spacing:6px;font-weight:700;margin-bottom:18px}
.concl{width:100%;background:#F0C24B;border-radius:24px;padding:34px 30px;box-shadow:0 12px 34px rgba(240,194,75,.25);margin-bottom:42px}
.concl .tx{font-size:56px;color:#0C2625;font-weight:900;line-height:1.36;letter-spacing:1px;text-align:center}
.sub{font-size:36px;color:#7E9C98;letter-spacing:5px;font-weight:700;margin-bottom:26px}
.item{width:100%;margin-bottom:30px;text-align:center}
.t1{font-size:46px;font-weight:800;line-height:1.34;letter-spacing:1px;color:#E8F0EE}
.t1 em{font-style:normal;color:#F0C24B;font-weight:900}
.t2{font-size:36px;font-weight:500;line-height:1.4;color:#9FB5B1;margin-top:4px}
.next{width:100%;border:4px solid #F0C24B;border-radius:20px;padding:24px 26px;margin-top:12px;background:rgba(240,194,75,.08)}
.next .lb{font-size:32px;color:#F0C24B;font-weight:800;letter-spacing:5px;margin-bottom:8px}
.next .tx{font-size:44px;color:#E8F0EE;font-weight:900;line-height:1.3}
.follow{font-size:36px;color:#7E9C98;margin-top:28px;letter-spacing:3px;font-weight:600}
.sign{margin-top:26px;font-size:30px;color:#6B8582;letter-spacing:3px}
</style></head><body><div class="wrap">
<div class="brand"><img src="__LOGO__"><div class="nm">老蔡说</div></div>
<div class="rule"></div>
<div class="tag">这一讲，就一句话</div>
<div class="concl"><div class="tx">躲不可怕<br>可怕的是“失联”</div></div>
<div class="sub">记住这三步</div>
<div class="item"><div class="t1">1. 不用解释清楚</div><div class="t2">只要给一个时间点</div></div><div class="item"><div class="t1">2. “我现在有点乱，等会儿我找你”</div><div class="t2">不是“别烦我”，是“我还会回来”</div></div><div class="item"><div class="t1">3. 给个时间</div><div class="t2">比讲一堆道理都管用</div></div>
<div class="next"><div class="lb">下一讲</div><div class="tx">吵到一半，大脑突然断线，<br>人是怎么“变傻”的？</div></div>
<div class="follow">跟上这个系列，下一讲还在这等你</div>
<div class="sign">正在学心理学的普通人 · 只说心事，不说教</div>
</div></body></html>
