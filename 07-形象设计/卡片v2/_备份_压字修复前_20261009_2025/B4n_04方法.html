<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  @font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#0C2625;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 30% 20%,#123330 0%,#0C2625 55%,#081A19 100%)}
  .glow{position:absolute;right:-10%;top:8%;width:1200px;height:1000px;background:radial-gradient(closest-side,rgba(240,194,75,.16),rgba(240,194,75,0) 72%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid rgba(240,194,75,.26)}
  .col-left{position:absolute;left:140px;top:700px;width:200px;display:flex;flex-direction:column;align-items:center}
  .corekey{font-weight:900;color:#F0C24B;font-size:150px;line-height:1;text-shadow:0 6px 30px rgba(240,194,75,.35)}
  .numline{width:5px;height:90px;background:linear-gradient(180deg,#F0C24B,rgba(240,194,75,.2));margin:26px 0}
  .label{font-family:"Kai","KaiTi",serif;font-size:42px;font-weight:700;color:#7E9C98;letter-spacing:8px;writing-mode:vertical-rl}
  .brand{position:absolute;left:390px;right:120px;top:170px;height:120px;display:flex;align-items:center;gap:20px;border-bottom:6px solid #F0C24B;padding-bottom:22px}
  .brand img{width:104px;height:104px}
  .brand .name{font-family:"Kai","KaiTi",serif;font-size:58px;font-weight:700;color:#F0C24B;letter-spacing:10px}
  .tag{position:absolute;left:390px;right:120px;top:360px;font-size:40px;color:#7E9C98;letter-spacing:8px;font-weight:700}
  .stage{position:absolute;left:390px;right:120px;top:520px;height:800px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
  .big{font-weight:900;color:#EAF3F1;font-size:98px;line-height:1.46;letter-spacing:4px;font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;color:#0C2625;background:#F0C24B;padding:6px 22px 10px;display:inline-block;border-radius:6px;letter-spacing:5px}
  .punch{position:absolute;left:390px;right:120px;top:1380px;font-size:50px;font-weight:600;color:#9FB5B1;letter-spacing:4px;line-height:1.7}
  .sign{position:absolute;left:390px;right:120px;bottom:150px;font-size:29px;color:#6B8582;letter-spacing:4px}
  .sign .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#F0C24B;margin:0 16px 3px 16px}
</style></head>
<body><div class="bg"></div><div class="glow"></div><div class="frame"></div>
<div class="brand"><img src="__LOGO__"><div class="name">老蔡说</div></div>
<div class="col-left"><div class="corekey">04</div><div class="numline"></div><div class="label">方法★</div></div>
<div class="tag">方法★</div>
<div class="stage"><div class="big">别硬讲道理<br>喊停：<em>给我10分钟</em></div></div>
<div class="punch">然后真的离开 10 分钟</div>
<div class="sign">正在学心理学的普通人<span class="d"></span>只说心事，不说教</div>
</body></html>
