<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
@font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
@font-face{font-family:'NotoSC';src:local('Noto Sans SC'),local('Source Han Sans SC'),local('Microsoft YaHei')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#0C2625;
       font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 30% 20%,#123330 0%,#0C2625 55%,#081A19 100%)}
  .glow{position:absolute;right:-10%;top:8%;width:1200px;height:1000px;
        background:radial-gradient(closest-side,rgba(240,194,75,.16),rgba(240,194,75,0) 72%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid rgba(240,194,75,.26)}
  .col-left{position:absolute;left:150px;top:520px;width:190px;height:760px;
            display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
  .corekey{font-weight:900;color:#F0C24B;font-size:118px;line-height:1;text-shadow:0 6px 30px rgba(240,194,75,.35)}
  .numline{width:5px;height:90px;background:linear-gradient(180deg,#F0C24B,rgba(240,194,75,.2));margin:26px 0}
  .label{writing-mode:vertical-rl;text-orientation:upright;font-family:"Kai","KaiTi",serif;
         font-size:44px;font-weight:700;color:#7E9C98;letter-spacing:12px}
  .brand{position:absolute;left:365px;right:118px;top:170px;height:120px;
         display:flex;align-items:center;gap:20px;border-bottom:6px solid #F0C24B;padding-bottom:22px}
  .brand img{width:104px;height:104px}
  .brand .name{font-family:"Kai","KaiTi",serif;font-size:58px;font-weight:700;color:#F0C24B;letter-spacing:14px}
  .stage{position:absolute;left:365px;right:118px;top:640px;height:640px;
         display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left}
  .big{font-weight:800;color:#EAF2F0;font-size:96px;line-height:1.42;letter-spacing:4px;font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;color:#0C2625;background:#F0C24B;padding:8px 24px 10px;
          display:inline-block;border-radius:4px;font-size:112px;letter-spacing:6px}
  .punch{position:absolute;left:365px;right:118px;top:1330px;text-align:left;
         font-size:50px;font-weight:600;color:#8FB0AB;letter-spacing:5px;line-height:1.7}
  .sign{position:absolute;left:365px;right:118px;top:1500px;font-size:29px;color:#6E8A86;letter-spacing:4px}
</style></head><body>
  <div class="bg"></div><div class="glow"></div><div class="frame"></div>
  <div class="col-left"><div class="corekey">01</div><div class="numline"></div><div class="label">开口</div></div>
  <div class="brand"><img src="__LOGO__"><div class="name">老蔡说</div></div>
  <div class="stage"><div class="big">就炸</div></div>
  <div class="punch">你一张嘴，对方就炸了<br>问题就在头三个字</div>
  <div class="sign">正在学心理学的普通人·只说心事，不说教</div>
</body></body></html>
