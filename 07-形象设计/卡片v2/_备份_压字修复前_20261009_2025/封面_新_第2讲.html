<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
@font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
@font-face{font-family:'NotoSC';src:local('Noto Sans SC'),local('Source Han Sans SC'),local('Microsoft YaHei')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#F7EEDC;
       font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 18%,#FFFDF7 0%,#FAF2E2 52%,#F4E9D4 100%)}
  .glow{position:absolute;left:50%;top:6%;width:1500px;height:1150px;transform:translateX(-50%);
        background:radial-gradient(closest-side,rgba(255,220,158,.44),rgba(255,225,170,0) 72%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid rgba(190,85,55,.28)}
  .top{position:absolute;left:0;right:0;top:118px;text-align:center}
  .top .name{font-family:"Kai","KaiTi",serif;font-size:58px;font-weight:700;color:#8C2F2F;letter-spacing:16px}
  .ep{display:inline-block;margin-top:22px;font-family:"Kai","KaiTi",serif;font-size:40px;
      color:#FFF8F0;background:#C8552F;padding:8px 30px 10px;border-radius:6px;letter-spacing:8px}
  .rule{position:absolute;left:50%;top:400px;transform:translateX(-50%);width:190px;height:5px;background:#C8552F;opacity:.5}
  .stage{position:absolute;left:130px;right:130px;top:640px;height:620px;
         display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .big{font-weight:800;color:#2E2A26;font-size:146px;line-height:1.44;letter-spacing:6px;
       text-shadow:0 2px 0 rgba(255,255,255,.55);font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;color:#FFF8F0;background:#D64B1E;padding:10px 28px 14px;
          display:inline-block;border-radius:6px;box-shadow:0 8px 26px rgba(190,70,30,.24);letter-spacing:8px}
  .sign{position:absolute;left:0;right:0;top:1560px;text-align:center;font-size:29px;color:#9C8D7B;letter-spacing:4px}
</style></head><body>
  <div class="bg"></div><div class="glow"></div><div class="frame"></div>
  <div class="top"><div class="name">老蔡说</div><div class="ep">第 2 讲</div></div>
  <div class="rule"></div>
  <div class="stage"><div class="big">情绪一上来就炸<br><em>都栽在同一步</em></div></div>
  <div class="sign">正在学心理学的普通人·只说心事，不说教</div>
</body></html>
