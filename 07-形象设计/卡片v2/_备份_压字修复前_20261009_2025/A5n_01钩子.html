<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>钩子</title>
<style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  @font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#2A1512;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 20%,#4A2118 0%,#3A1A14 50%,#2A1512 100%)}
  .glow{position:absolute;left:50%;top:6%;width:1500px;height:1200px;transform:translateX(-50%);background:radial-gradient(closest-side,#FF8A3D33,transparent 70%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid #E8743A66}
  .brand{position:absolute;left:0;right:0;top:150px;height:110px;display:flex;align-items:center;justify-content:center;gap:18px}
  .brand img{width:100px;height:100px}
  .brand .name{font-family:'Kai','KaiTi',serif;font-size:56px;font-weight:700;color:#FFD9A8;letter-spacing:14px}
  .rule{position:absolute;left:50%;top:296px;transform:translateX(-50%);width:190px;height:5px;background:#E8743A;opacity:.85}
  .tag{position:absolute;left:0;right:0;top:360px;text-align:center;font-size:40px;color:#D9A98A;letter-spacing:8px;font-weight:700}
  .stage{position:absolute;left:120px;right:120px;top:540px;height:700px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .big{font-weight:800;color:#FFF7EC;font-size:108px;line-height:1.5;letter-spacing:6px;text-shadow:0 4px 18px rgba(0,0,0,.5);font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;color:#241004;background:#FF8A3D;padding:10px 30px 13px;display:inline-block;border-radius:8px;box-shadow:0 10px 34px #FF8A3D55;letter-spacing:7px}
  .punch{position:absolute;left:150px;right:150px;top:1330px;text-align:center;font-size:54px;font-weight:700;color:#F3D9C0;letter-spacing:5px;line-height:1.7}
  .sign{position:absolute;left:0;right:0;top:1600px;text-align:center;font-size:29px;color:#B08C74;letter-spacing:4px}
  .sign .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#FF8A3D;margin:0 16px 3px 16px}
  #e_big,#e_punch{opacity:0}
</style></head>
<body>
  <div class="bg"></div><div class="glow"></div><div class="frame"></div>
  <div class="brand"><img src="__LOGO__"><div class="name">老蔡说</div></div>
  <div class="rule"></div><div class="tag">钩子</div>
  <div class="stage"><div class="big" id="e_big">一句话没说对<br>他<em>就炸了</em></div></div>
  <div class="punch" id="e_punch">炸的不是这句话</div>
  <div class="sign">正在学心理学的普通人<span class="d"></span>只说心事，不说教</div>
<script>
  window.__runAnim=function(){
    var b=document.getElementById('e_big'),p=document.getElementById('e_punch');
    b.style.transition='opacity .45s ease, transform .5s cubic-bezier(.2,.9,.3,1.4)';
    p.style.transition='opacity .45s ease, transform .5s cubic-bezier(.2,.9,.3,1.4)';
    b.style.transform='translateY(40px)';p.style.transform='translateY(40px)';
    setTimeout(function(){b.style.transform='translateY(0)';b.style.opacity='1';},60);
    setTimeout(function(){p.style.transform='translateY(0)';p.style.opacity='1';},720);
  };
</script>
</body></html>
