<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
@font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
@font-face{font-family:'NotoSC';src:local('Noto Sans SC'),local('Source Han Sans SC'),local('Microsoft YaHei')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#0C2625;
       font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 30% 20%,#123330 0%,#0C2625 55%,#081A19 100%)}
  .glow{position:absolute;right:-10%;top:8%;width:1200px;height:1000px;
        background:radial-gradient(closest-side,rgba(240,194,75,.16),rgba(240,194,75,0) 72%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid rgba(240,194,75,.26)}
  .top{position:absolute;left:140px;right:140px;top:150px;text-align:left}
  .top .name{font-family:"Kai","KaiTi",serif;font-size:58px;font-weight:700;color:#F0C24B;letter-spacing:16px}
  .ep{display:inline-block;margin-top:24px;font-family:"Kai","KaiTi",serif;font-size:40px;
      color:#0C2625;background:#F0C24B;padding:8px 30px 10px;border-radius:4px;letter-spacing:8px}
  .rule{position:absolute;left:140px;top:420px;width:190px;height:6px;background:#F0C24B;opacity:.75}
  .stage{position:absolute;left:140px;right:140px;top:640px;height:640px;
         display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left}
  .big{font-weight:800;color:#EAF2F0;font-size:118px;line-height:1.42;letter-spacing:4px;font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;color:#0C2625;background:#F0C24B;padding:10px 26px 12px;
          display:inline-block;border-radius:4px;font-size:132px;letter-spacing:6px}
  .sign{position:absolute;left:140px;top:1500px;font-size:29px;color:#6E8A86;letter-spacing:4px}
</style></head><body>
  <div class="bg"></div><div class="glow"></div><div class="frame"></div>
  <div class="top"><div class="name">老蔡说</div><div class="ep">第 2 讲</div></div>
  <div class="rule"></div>
  <div class="stage"><div class="big">你一开口他就炸<br><em>问题在头三个字</em></div></div>
  <div class="sign">正在学心理学的普通人·只说心事，不说教</div>
</body></html>
