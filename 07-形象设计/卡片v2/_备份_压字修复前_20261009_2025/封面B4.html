<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  @font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#0C2625;font-family:"Microsoft YaHei",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 40% 22%,#123330 0%,#0C2625 58%,#081A19 100%)}
  .glow{position:absolute;right:-15%;top:6%;width:1400px;height:1200px;background:radial-gradient(closest-side,rgba(240,194,75,.18),rgba(240,194,75,0) 72%)}
  .frame{position:absolute;left:50px;top:50px;right:50px;bottom:50px;border:3px solid rgba(240,194,75,.3)}
  .top{position:absolute;left:0;right:0;top:230px;display:flex;align-items:center;justify-content:center;gap:26px}
  .top img{width:150px;height:150px}
  .top .name{font-family:"Kai","KaiTi",serif;font-size:88px;font-weight:700;color:#F0C24B;letter-spacing:20px}
  .stage{position:absolute;left:120px;right:120px;top:640px;text-align:center}
  .big{font-family:'DouyinSans','Kai',sans-serif;font-weight:900;color:#EAF3F1;font-size:150px;line-height:1.42;letter-spacing:8px}
  .big em{font-style:normal;color:#0C2625;background:#F0C24B;padding:10px 34px 16px;display:inline-block;border-radius:10px;letter-spacing:12px}
  .ep{position:absolute;left:0;right:0;top:1180px;text-align:center;font-size:54px;color:#9FB5B1;letter-spacing:10px;font-weight:600}
  .tag{position:absolute;left:0;right:0;top:1400px;text-align:center;font-size:48px;color:#F0C24B;letter-spacing:14px;font-weight:800}
  .sign{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-size:40px;color:#6B8582;letter-spacing:6px}
  .rule{position:absolute;left:50%;top:420px;transform:translateX(-50%);width:300px;height:6px;background:rgba(240,194,75,.5);opacity:.55}
</style></head><body>
<div class="bg"></div><div class="glow"></div><div class="frame"></div>
<div class="top"><img src="__LOGO__"><div class="name">老蔡说</div></div>
<div class="rule"></div>
<div class="stage"><div class="big">吵到一半<br>大脑<em>断线</em></div></div>
<div class="ep">怎么办</div>
<div class="tag">B 线 · 关系修复</div>
<div class="sign">正在学心理学的普通人 · 只说心事，不说教</div>
</body></html>
