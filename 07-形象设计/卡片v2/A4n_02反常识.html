<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  @font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#F7EEDC;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 18%,#FFFDF7 0%,#FAF2E2 52%,#F4E9D4 100%)}
  .glow{position:absolute;left:50%;top:7%;width:1500px;height:1200px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,220,158,.44),rgba(255,225,170,0) 72%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid rgba(190,85,55,.28)}
  .brand{position:absolute;left:0;right:0;top:150px;height:110px;display:flex;align-items:center;justify-content:center;gap:18px}
  .brand img{width:100px;height:100px}
  .brand .name{font-family:"Kai","KaiTi",serif;font-size:56px;font-weight:700;color:#8C2F2F;letter-spacing:14px}
  .rule{position:absolute;left:50%;top:296px;transform:translateX(-50%);width:190px;height:5px;background:#C8552F;opacity:.5}
  .tag{position:absolute;left:0;right:0;top:360px;text-align:center;font-size:40px;color:#B07A5A;letter-spacing:8px;font-weight:700}
  .stage{position:absolute;left:150px;right:150px;top:470px;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .big{font-weight:800;color:#2E2A26;font-size:88px;line-height:1.68;letter-spacing:2px;text-shadow:0 2px 0 rgba(255,255,255,.55);font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;font-size:132px;color:#C93A0C;background:none;padding:0 4px;display:inline-block;vertical-align:middle;letter-spacing:4px;font-family:'KaiTi','STKaiti','楷体',serif;border-radius:0;box-shadow:none}
  .punch{position:absolute;left:160px;right:160px;top:1330px;text-align:center;font-size:44px;font-weight:600;color:#7A7168;letter-spacing:5px;line-height:1.7}
  .sign{position:absolute;left:0;right:0;top:1600px;text-align:center;font-size:29px;color:#9C8D7B;letter-spacing:4px}
  .sign .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#D9A15E;margin:0 16px 3px 16px}
.big em.c2{font-size:156px;color:#123A5C;background:none;padding:0 4px;border-radius:0;box-shadow:none}

/* ★ 装饰层（2026-10-09 加：视觉动线 + 丰富度，不碰文字色块规矩） */
.tag::before,.tag::after{content:"";position:absolute;top:50%;width:66px;height:3px;
  background:linear-gradient(90deg,transparent,#C8552F);transform:translateY(-50%)}
.tag::after{background:linear-gradient(270deg,transparent,#C8552F)}
.tag{position:absolute;left:0;right:0;top:360px}
.tagwrap{position:absolute;left:0;right:0;top:360px;height:44px;display:flex;align-items:center;justify-content:center}
.tagwrap .tl,.tagwrap .tr{width:70px;height:3px}
.tagwrap .tl{background:linear-gradient(90deg,transparent,#C8552F)}
.tagwrap .tr{background:linear-gradient(270deg,transparent,#C8552F)}
.dots{position:absolute;left:0;right:0;top:1080px;height:220px;opacity:.5;
  background-image:radial-gradient(#C8552F 2px,transparent 2px);background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent 78%);
  mask-image:radial-gradient(closest-side,#000,transparent 78%)}
.punch::before{content:"";position:absolute;left:50%;top:-34px;transform:translateX(-50%);
  width:52px;height:4px;background:#C8552F;opacity:.45;border-radius:2px}
.corner{position:absolute;width:46px;height:46px;border-color:rgba(200,85,47,.5)}
.corner.tl{left:96px;top:96px;border-left:4px solid;border-top:4px solid}
.corner.tr{right:96px;top:96px;border-right:4px solid;border-top:4px solid}
.corner.bl{left:96px;bottom:96px;border-left:4px solid;border-bottom:4px solid}
.corner.br{right:96px;bottom:96px;border-right:4px solid;border-bottom:4px solid}

/* ★ 装饰层 2026-10-09 */
.dots{position:absolute;left:0;right:0;top:1080px;height:220px;opacity:.45;
  background-image:radial-gradient(#C8552F 2px,transparent 2px);background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent 78%);
  mask-image:radial-gradient(closest-side,#000,transparent 78%)}
.corner{position:absolute;width:46px;height:46px;border-color:#C8552F88}
.corner.tl{left:96px;top:96px;border-left:4px solid;border-top:4px solid}
.corner.tr{right:96px;top:96px;border-right:4px solid;border-top:4px solid}
.corner.bl{left:96px;bottom:96px;border-left:4px solid;border-bottom:4px solid}
.corner.br{right:96px;bottom:96px;border-right:4px solid;border-bottom:4px solid}
</style></head>
<body>
  <div class="bg"></div><div class="glow"></div><div class="frame"></div><div class="dots"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="brand"><img src="__LOGO__"><div class="name">老蔡说</div></div>
  <div class="rule"></div><div class="dots"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="tag">为什么</div>
  <div class="stage"><div class="big">堵这个东西<br>你越<em class="c2">堵</em>它<br>它越硬</div></div>
  <div class="punch">因为你在跟它打架</div>
  <div class="sign">正在学心理学的普通人<span class="d"></span>只说心事，不说教</div>
</body></html>
