<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
@font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
@font-face{font-family:'NotoSC';src:local('Noto Sans SC'),local('Source Han Sans SC'),local('Microsoft YaHei')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#F7EEDC;
       font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 18%,#FFFDF7 0%,#FAF2E2 52%,#F4E9D4 100%)}
  .glow{position:absolute;left:50%;top:7%;width:1500px;height:1200px;transform:translateX(-50%);
        background:radial-gradient(closest-side,rgba(255,220,158,.44),rgba(255,225,170,0) 72%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid rgba(190,85,55,.28)}
  .brand{position:absolute;left:0;right:0;top:150px;height:110px;
         display:flex;align-items:center;justify-content:center;gap:18px}
  .brand img{width:100px;height:100px}
  .brand .name{font-family:"Kai","KaiTi",serif;font-size:56px;font-weight:700;color:#8C2F2F;letter-spacing:14px}
  .rule{position:absolute;left:50%;top:296px;transform:translateX(-50%);width:190px;height:5px;background:#C8552F;opacity:.5}
  .stage{position:absolute;left:150px;right:150px;top:560px;height:640px;
         display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .big{font-weight:800;color:#2E2A26;font-size:108px;line-height:1.5;letter-spacing:6px;
       text-shadow:0 2px 0 rgba(255,255,255,.55);font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;color:#FFF8F0;background:#D64B1E;padding:9px 28px 12px;
          display:inline-block;border-radius:6px;box-shadow:0 8px 24px rgba(190,70,30,.22);letter-spacing:7px}
  .punch{position:absolute;left:170px;right:170px;top:1330px;text-align:center;
         font-size:52px;font-weight:600;color:#7A7168;letter-spacing:5px;line-height:1.7}
  .sign{position:absolute;left:0;right:0;top:1560px;text-align:center;font-size:29px;color:#9C8D7B;letter-spacing:4px}
  .sign .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#D9A15E;margin:0 16px 3px 16px}
</style></head>

window.__setT=function(t){
 function cl(x){return x<0?0:x>1?1:x;}
 function out(p){return 1-Math.pow(1-p,2);}
 function back(p){var c=1.6;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);}
 var E=function(i){return document.getElementById(i);};
 var BRAND=0.12, BIG=0.24, EM=1.04, PUNCH=0.79, CORE=0.10, RULE=0.24, LABEL=0.60;
 // 品牌条
 var p1=out(cl((t-BRAND)/0.45)),b=E('e_brand');
 if(b){b.style.opacity=p1;b.style.transform='translateY('+(-45*(1-p1)).toFixed(1)+'px)';}
 // 分割线
 var p2=out(cl((t-RULE)/0.40)),r=E('e_rule');
 if(r){r.style.transform='scaleX('+p2.toFixed(3)+')';r.style.transformOrigin='center';}
 // 主标题（跟口播第一句）
 var p3=out(cl((t-BIG)/0.55)),g=E('e_big');
 if(g){g.style.opacity=p3;g.style.transform='translateY('+(200*(1-p3)).toFixed(1)+'px)';}
 // 辅助句
 var p4=out(cl((t-PUNCH)/0.55)),pu=E('e_punch');
 if(pu){pu.style.opacity=p4;pu.style.transform='translateY('+(90*(1-p4)).toFixed(1)+'px)';}
 // ★ 重点色块（跟口播说到重点那句）
 var p5=back(cl((t-EM)/0.55)),e=E('e_em');
 if(e){e.style.opacity=cl((t-EM)/0.30);e.style.transform='scale('+(0.3+0.7*p5).toFixed(3)+')';}
 // B线左栏
 var cw=E('e_corekey');
 if(cw){cw.style.opacity=out(cl((t-CORE)/0.60));cw.style.transform='translateY('+(-120*(1-out(cl((t-CORE)/0.60)))).toFixed(1)+'px)';}
 var nl=E('e_numline');
 if(nl){nl.style.transform='scaleY('+out(cl((t-CORE+0.20)/0.50)).toFixed(3)+')';nl.style.transformOrigin='top';}
 var lb=E('e_label');
 if(lb){lb.style.opacity=out(cl((t-LABEL)/0.45));lb.style.transform='translateY('+(40*(1-out(cl((t-LABEL)/0.45)))).toFixed(1)+'px)';}
};
