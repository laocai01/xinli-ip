<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>钩子</title>
<style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  @font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#0E1A16;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 20%,#17302A 0%,#12241E 50%,#0E1A16 100%)}
  .glow{position:absolute;left:50%;top:6%;width:1500px;height:1200px;transform:translateX(-50%);background:radial-gradient(closest-side,#FFD24A33,transparent 70%)}
  .frame{position:absolute;left:52px;top:52px;right:52px;bottom:52px;border:2px solid #5FD1A066}
  .brand{position:absolute;left:0;right:0;top:150px;height:110px;display:flex;align-items:center;justify-content:center;gap:18px}
  .brand img{width:100px;height:100px}
  .brand .name{font-family:'Kai','KaiTi',serif;font-size:56px;font-weight:700;color:#BFE8D2;letter-spacing:14px}
  .rule{position:absolute;left:50%;top:296px;transform:translateX(-50%);width:190px;height:5px;background:#5FD1A0;opacity:.85}
  .tag{position:absolute;left:0;right:0;top:360px;text-align:center;font-size:40px;color:#8FBFA8;letter-spacing:8px;font-weight:700}
  .stage{position:absolute;left:150px;right:150px;top:470px;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .big{font-weight:800;color:#F2FFF8;font-size:88px;line-height:1.68;letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.5);font-family:'DouyinSans','Kai',sans-serif;}
  .big em{font-style:normal;font-size:132px;color:#C98A12;background:none;padding:0 4px;display:inline-block;vertical-align:middle;letter-spacing:4px;font-family:'KaiTi','STKaiti','楷体',serif;border-radius:0;box-shadow:none}
  .punch{position:absolute;left:150px;right:150px;top:1330px;text-align:center;font-size:44px;font-weight:700;color:#CFEBDD;letter-spacing:5px;line-height:1.7}
  .sign{position:absolute;left:0;right:0;top:1600px;text-align:center;font-size:29px;color:#7FA793;letter-spacing:4px}
  .sign .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#FFD24A;margin:0 16px 3px 16px}
  #e_big,#e_punch{opacity:0}
.big em.c2{font-size:156px;color:#0C5A4E;background:none;padding:0 4px;border-radius:0;box-shadow:none}

/* ★ 装饰层 2026-10-09 */
.dots{position:absolute;left:0;right:0;top:1080px;height:220px;opacity:.45;
  background-image:radial-gradient(#C9A227 2px,transparent 2px);background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent 78%);
  mask-image:radial-gradient(closest-side,#000,transparent 78%)}
.corner{position:absolute;width:46px;height:46px;border-color:#C9A22788}
.corner.tl{left:96px;top:96px;border-left:4px solid;border-top:4px solid}
.corner.tr{right:96px;top:96px;border-right:4px solid;border-top:4px solid}
.corner.bl{left:96px;bottom:96px;border-left:4px solid;border-bottom:4px solid}
.corner.br{right:96px;bottom:96px;border-right:4px solid;border-bottom:4px solid}
</style></head>
<body>
  <div class="bg"></div><div class="glow"></div><div class="frame"></div><div class="dots"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="brand"><img src="__LOGO__"><div class="name">老蔡说</div></div>
  <div class="rule"></div><div class="tag">钩子</div>
  <div class="stage"><div class="big" id="e_big">吵到一半<br>脑子一片<em class="c2">空白</em></div></div>
  <div class="punch" id="e_punch">事后才想起来：当时我该那么说啊</div>
  <div class="sign">正在学心理学的普通人<span class="d"></span>只说心事，不说教</div>
<script>
  window.__runAnim=function(){
    var b=document.getElementById('e_big'),p=document.getElementById('e_punch');
    b.style.transition='opacity .45s ease, transform .5s cubic-bezier(.2,.9,.3,1.4)';
    p.style.transition='opacity .45s ease, transform .5s cubic-bezier(.2,.9,.3,1.4)';
    b.style.transform='translateY(40px)';p.style.transform='translateY(40px)';
    setTimeout(function(){b.style.transform='translateY(0)';b.style.opacity='1';},60);
    setTimeout(function(){p.style.transform='translateY(0)';p.style.opacity='1';},720);
  };
</script>
</body></html>
