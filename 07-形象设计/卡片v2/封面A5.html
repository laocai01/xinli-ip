<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  @font-face{font-family:'DouyinSans';src:local('DouyinSans'),local('Douyin Sans Bold'),local('抖音美好体')}
  html,body{margin:0;padding:0;overflow:hidden}
  body{width:1080px;height:1920px;position:relative;background:#F7EEDC;font-family:"Microsoft YaHei",sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 20%,#FFFDF7 0%,#FAF2E2 52%,#F4E9D4 100%)}
  .glow{position:absolute;left:50%;top:5%;width:1600px;height:1300px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,215,150,.5),rgba(255,225,170,0) 72%)}
  .frame{position:absolute;left:50px;top:50px;right:50px;bottom:50px;border:3px solid rgba(190,85,55,.32)}
  .top{position:absolute;left:0;right:0;top:230px;display:flex;align-items:center;justify-content:center;gap:26px}
  .top img{width:150px;height:150px}
  .top .name{font-family:"Kai","KaiTi",serif;font-size:88px;font-weight:700;color:#8C2F2F;letter-spacing:20px}
  .stage{position:absolute;left:140px;right:140px;top:520px;height:820px;display:flex;align-items:center;justify-content:center;text-align:center}
  .big{font-family:'DouyinSans','Kai',sans-serif;font-weight:900;color:#2E2A26;font-size:110px;line-height:1.95;letter-spacing:2px;text-shadow:0 4px 0 rgba(255,255,255,.6)}
  .big em{font-family:'KaiTi','STKaiti','楷体',serif;font-style:normal;font-size:172px;color:#FFF8F0;padding:6px 18px 10px;display:inline-block;vertical-align:middle;letter-spacing:3px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' preserveAspectRatio='none'><path d='M6 22 C 30 8, 90 4, 150 12 S 196 26, 194 48 C 192 74, 130 92, 60 88 S 4 74, 6 22 Z' fill='%23B01B25'/></svg>");background-repeat:no-repeat;background-size:100% 100%;background-position:center}
  .ep{position:absolute;left:0;right:0;top:1180px;text-align:center;font-size:54px;color:#8A7A63;letter-spacing:10px;font-weight:600}
  .tag{position:absolute;left:0;right:0;top:1400px;text-align:center;font-size:48px;color:#B9441E;letter-spacing:14px;font-weight:800}
  .sign{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-size:40px;color:#9C8D7B;letter-spacing:6px}
  .rule{position:absolute;left:50%;top:420px;transform:translateX(-50%);width:300px;height:6px;background:rgba(190,85,55,.5);opacity:.55}
.big em.c2{font-size:202px;color:#FFE45C;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' preserveAspectRatio='none'><path d='M8 20 C 40 6, 100 2, 160 14 S 196 30, 192 52 C 188 78, 120 94, 52 88 S 2 72, 8 20 Z' fill='%234A1D6E'/></svg>");background-size:100% 100%;padding:8px 22px 12px}

/* ★ 装饰层 2026-10-09 */
.dots{position:absolute;left:0;right:0;top:1080px;height:220px;opacity:.45;
  background-image:radial-gradient(#C8552F 2px,transparent 2px);background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent 78%);
  mask-image:radial-gradient(closest-side,#000,transparent 78%)}
.corner{position:absolute;width:46px;height:46px;border-color:#C8552F88}
.corner.tl{left:96px;top:96px;border-left:4px solid;border-top:4px solid}
.corner.tr{right:96px;top:96px;border-right:4px solid;border-top:4px solid}
.corner.bl{left:96px;bottom:96px;border-left:4px solid;border-bottom:4px solid}
.corner.br{right:96px;bottom:96px;border-right:4px solid;border-bottom:4px solid}
</style></head><body>
<div class="bg"></div><div class="glow"></div><div class="frame"></div><div class="dots"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="top"><img src="__LOGO__"><div class="name">老蔡说</div></div>
<div class="rule"></div>
<div class="stage"><div class="big">一点<em>就炸</em><br>不是<em class="c2">脾气差</em></div></div>

<div class="tag">A 线 · 情绪自救</div>
<div class="sign">正在学心理学的普通人 · 只说心事，不说教</div>
</body></html>
