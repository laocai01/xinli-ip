<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Kai';src:local('KaiTi'),local('STKaiti'),local('楷体')}
  html,body{margin:0;padding:0}
  body{width:1080px;height:1920px;overflow:hidden;position:relative;
       font-family:"Microsoft YaHei","PingFang SC",sans-serif;
       background:radial-gradient(120% 80% at 50% 12%, #FFFBF2 0%, #F8EFDD 42%, #EFE1C8 100%)}

  /* 极淡纸纹 */
  .grain{position:absolute;inset:0;opacity:.30;mix-blend-mode:multiply;
         background-image:repeating-linear-gradient(0deg, rgba(140,47,47,.045) 0 1px, transparent 1px 4px),
                          repeating-linear-gradient(90deg, rgba(140,47,47,.035) 0 1px, transparent 1px 5px)}

  /* 暖光晕 */
  .glow{position:absolute;left:50%;top:8%;width:1200px;height:900px;transform:translateX(-50%);
        background:radial-gradient(closest-side, rgba(255,225,170,.55), rgba(255,225,170,0) 70%)}

  /* 朱红断线框 */
  .frame{position:absolute;left:56px;top:56px;right:56px;bottom:56px;
         border:3px dashed rgba(180,70,47,.42);border-radius:6px}
  .frame2{position:absolute;left:74px;top:74px;right:74px;bottom:74px;
          border:1px solid rgba(180,70,47,.16)}

  /* 顶部品牌条 */
  .brand{position:absolute;left:0;right:0;top:118px;display:flex;align-items:center;
         justify-content:center;gap:20px}
  .brand img{width:78px;height:78px;display:block}
  .brand .name{font-family:"Kai","KaiTi",serif;font-size:44px;font-weight:700;
               color:#8C2F2F;letter-spacing:8px}
  .rule{position:absolute;left:50%;top:224px;transform:translateX(-50%);
        width:180px;height:5px;border-radius:3px;background:#C8552F;opacity:.65}

  /* 中部大字区（留给文案压字） */
  .stage{position:absolute;left:120px;right:120px;top:430px;bottom:430px}

  /* 底部签名 */
  .sign{position:absolute;left:0;right:0;bottom:196px;text-align:center;
        font-size:27px;color:#8A7864;letter-spacing:2px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
       background:#E08A3C;margin:0 12px 3px 12px}
  /* 底部字幕安全区标记（视觉上不可见，仅占位） */
  .safe{position:absolute;left:0;right:0;bottom:0;height:300px}
</style></head>
