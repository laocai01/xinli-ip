<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1125px;height:633px;background:#F7F1E3;overflow:hidden;
       font-family:"Microsoft YaHei","KaiTi",sans-serif;position:relative}
  .frame{position:absolute;left:20px;top:20px;right:20px;bottom:20px;
         border:3px dashed #B4462F;opacity:.5}
  .wrap{position:absolute;left:150px;right:150px;top:78px;text-align:center}
  .name{font-family:"KaiTi","STKaiti",serif;font-size:104px;font-weight:700;
        color:#8C2F2F;letter-spacing:12px;line-height:1.0}
  .bar{width:170px;height:7px;background:#C8552F;margin:30px auto 32px;border-radius:4px}
  .slogan{font-size:50px;font-weight:700;color:#4A3A2A;letter-spacing:4px}
  .sub{margin-top:30px;font-size:26px;color:#7A6A58;letter-spacing:1px}
</style></head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="name">老蔡说</div>
    <div class="bar"></div>
    <div class="slogan">只说心事，不说教</div>
    <div class="sub">一个正在学心理学的普通人 · 把学到的讲给你听</div>
  </div>
</body></html>
