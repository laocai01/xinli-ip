<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'DY';src:url('file:///E:/心理咨询IP/07-形象设计/fonts/fonts-main/DouyinSans/DouyinSansBold.ttf') format('truetype');font-weight:700;font-display:block}
@font-face{font-family:'KAI';src:url('file:///C:/Windows/Fonts/simkai.ttf') format('truetype');font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}

.ch{display:inline-block;will-change:transform,opacity}

.nl{word-break:keep-all;overflow-wrap:normal}
.stage div,.stage span{word-break:keep-all;overflow-wrap:normal}
.brand{position:absolute;left:0;right:0;top:70px;display:flex;align-items:flex-end;

.brand .nm{font-family:'KAI','KaiTi','STKaiti',serif;font-weight:700;font-size:44px;
       line-height:.92;letter-spacing:3px;padding-bottom:2px}
.stage{position:absolute;left:72px;top:274px;width:886px;height:1346px;z-index:10}
.foot{position:absolute;left:72px;right:122px;top:1566px;z-index:10;
      font-size:28px;letter-spacing:.06em;line-height:1.6;color:var(--l3)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:15;mix-blend-mode:multiply;

  background-size:220px 220px}
</style></head><body style="--bg:#F7F4EE;--l1:#2E2A26;--l2:#6B6157;--l3:#6F6355;--em:#A04A24;--line:rgba(46,42,38,.14)">
<div class="bgtone"></div><div style="position:absolute;left:680px;top:200px;width:440px;height:440px;border-radius:50%;border:1px solid #2E2A26;opacity:0.10;z-index:2"></div><div style="position:absolute;left:72px;top:1250px;width:120px;height:3px;background:#A04A24;opacity:0.55;z-index:3"></div><div style="position:absolute;left:72px;top:1360px;width:1px;height:14px;background:#2E2A26;opacity:0.35;z-index:2"></div><div style="position:absolute;left:92px;top:1360px;width:1px;height:8px;background:#2E2A26;opacity:0.35;z-index:2"></div><div style="position:absolute;left:112px;top:1360px;width:1px;height:14px;background:#2E2A26;opacity:0.35;z-index:2"></div><div style="position:absolute;left:132px;top:1360px;width:1px;height:8px;background:#2E2A26;opacity:0.35;z-index:2"></div><div style="position:absolute;left:152px;top:1360px;width:1px;height:14px;background:#2E2A26;opacity:0.35;z-index:2"></div><div style="position:absolute;left:172px;top:1360px;width:1px;height:8px;background:#2E2A26;opacity:0.35;z-index:2"></div><div class="brand"><img src="E:/心理咨询IP/04-工程/overlay_new/logo_corner.png" style=""><div class="nm" style="color:#4B3026">老蔡说</div></div>
<div class="stage" style="display:flex;flex-direction:column;justify-content:center">
  <div style="text-align:center;font-size:70px;line-height:1.28;
       color:var(--l3);letter-spacing:.02em"
       data-anim="wipeL" data-delay="0.13" data-dur="0.6" data-stagger="0.04">睡了八个小时
起来还是累</div>
  <div style="display:flex;align-items:center;gap:26px;margin:52px 0">
    <div style="flex:1;height:1px;background:var(--line)"></div>
    <div style="font-family:'KAI',serif;font-size:46px;color:var(--em);letter-spacing:.2em">其实</div>
    <div style="flex:1;height:1px;background:var(--line)"></div>
  </div>
  <div style="text-align:center;font-size:100px;line-height:1.24;
       letter-spacing:-0.02em"
       data-anim="maskRise" data-delay="1.04" data-dur="0.64"><span style="color:var(--em);font-weight:700;letter-spacing:-0.01em">不是身体的事</span>
是心里有根绳子</div>
</div><div class="foot" style="text-align:center;letter-spacing:3px;font-weight:400">正在学心理学的普通人<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--em);margin:0 16px 4px 16px;opacity:.85"></span>只说心事，不说教</div><div class="grain" style="opacity:.05"></div>
<script>
// 自适应：任何文字块超出容器就缩字号，保证不出安全区（董事长：字不能出屏、不能单字成行）
(function(){
  var stage=document.querySelector('.stage');
  var W=stage.clientWidth, H=stage.clientHeight;
  document.querySelectorAll('.stage [data-anim]').forEach(function(el){
    var fs=parseFloat(getComputedStyle(el).fontSize);
    for(var i=0;i<60 && fs>22;i++){
      if(el.scrollWidth<=W+2 && el.scrollHeight<=H+2) break;
      fs*=0.96; el.style.fontSize=fs+'px';
    }
  });
})();
</script>

</body></html>
