他只剩一个

<span style="color:var(--em);font-weight:700;letter-spacing:-0.01em">就是你</span></div>

</div><div class="foot" style="text-align:center;letter-spacing:3px;font-weight:400">正在学心理学的普通人<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--em);margin:0 16px 4px 16px;opacity:.85"></span>只说心事，不说教</div><div class="grain" style="opacity:.045"></div>
<script>
// 自适应：任何文字块超出容器就缩字号，保证不出安全区（董事长：字不能出屏、不能单字成行）
(function(){
  var stage=document.querySelector('.stage');
  var W=stage.clientWidth, H=stage.clientHeight;
  document.querySelectorAll('.stage [data-anim]').forEach(function(el){
    var fs=parseFloat(getComputedStyle(el).fontSize);
    for(var i=0;i<60 && fs>22;i++){
      if(el.scrollWidth<=W+2 && el.scrollHeight<=H+2) break;
      fs*=0.96; el.style.fontSize=fs+'px';
    }
  });
})();
</script>
